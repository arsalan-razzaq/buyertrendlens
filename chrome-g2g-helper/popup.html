<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>G2G Chat Helper</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <h1>G2G Chat Helper</h1>

      <label class="field">
        <span>Upload CSV</span>
        <div class="uploadRow">
          <input id="csvFile" type="file" accept=".csv,text/csv,.txt">
          <button id="importButton" type="button" class="secondary">Import CSV</button>
        </div>
        <small id="queueMeta" class="hint">Manual input is active.</small>
      </label>

      <label class="field">
        <span>Seller IDs or URLs</span>
        <textarea id="sellerList" rows="7" placeholder="875683&#10;https://www.g2g.com/chat/#/user/123456"></textarea>
      </label>

      <label class="field">
        <span>Preset message</span>
        <textarea id="message" rows="5" placeholder="Hello, I want to ask about your listing."></textarea>
      </label>

      <div class="status" id="status">Queue is empty.</div>

      <div class="actions">
        <button id="saveButton" type="button">Save Queue</button>
        <button id="openButton" type="button">Start Sending</button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
